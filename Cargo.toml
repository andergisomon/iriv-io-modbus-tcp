[package]
name = "iriv-io-modbus-tcp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
keywords = ["cytron", "iriv-io", "iot", "modbus", "remote-io"]
categories = ["hardware-support"]
description = "Modbus/TCP firmware for the Cytron IRIV IO."
readme = "README.md"
repository = "https://github.com/andergisomon/iriv-io-modbus-tcp"

[dependencies]
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"]}
embassy-futures = "0.1.2"
embassy-net = { version = "0.7.1", features = ["defmt", "icmp", "tcp", "udp", "raw", "dhcpv4", "medium-ethernet", "dns", "proto-ipv4", "proto-ipv6", "multicast"] }
embassy-net-wiznet = { version = "0.2.1", features = ["defmt"]}
embassy-time = { version = "0.5.0", features = ["defmt"] }
embassy-rp = { version = "0.8.0", features = ["rp235xa", "defmt"]}
embedded-hal-bus = "0.3.0"
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
modbus-core = { version = "0.2.0", default-featues = false, features = ["tcp"]}
static_cell = "2.1.1"
defmt = "1.0.1"
embedded-io-async = "0.7.0"
embassy-embedded-hal = "0.5.0"

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabi" }
]
